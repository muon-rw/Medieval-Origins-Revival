plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

repositories {

    flatDir { dir "${rootProject.rootDir}/libs/" }

    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.ftb.mods")
        }
    }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = "https://maven.nucleoid.xyz/" }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.willbl.dev/releases" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven {
        url = 'https://maven.cafeteria.dev'
        content {
            includeGroup 'net.adriantodt.fabricmc'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.bai.lol" }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven { url "https://maven.willbl.dev/releases" }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://nexus.resourcefulbees.com/repository/maven-public/" }
    maven { url = "https://jm.gserv.me/repository/maven-public/" }

    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation project(":common")

    // Mixin
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))

    // Dev Env
    modRuntimeOnly "curse.maven:jade-324717:6291330"
    modCompileOnly ("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    modRuntimeOnly ("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")

    // Origins
    // Now stored locally since they are not pushed to ladysnake maven, see /libs/
    modImplementation("io.github.apace100:calio-1.11.2+mc.1.20.x")
    modImplementation("io.github.apace100:apoli-2.9.2+mc.1.20.x")
    modImplementation("io.github.apace100:Origins-1.10.2+mc.1.20.x")

    // Required deps for Origins, since we are now using local jars
    modImplementation "io.github.ladysnake:PlayerAbilityLib:${pal_version}"
    modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}") {exclude(group: "net.fabricmc.fabric-api")}
    modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {exclude(group: "net.fabricmc.fabric-api")}
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {exclude(group: "net.fabricmc.fabric-api")}
    // modImplementation("com.jamieswhiteshirt:reach-entity-attributes:${project.rea_version}")
    include(modApi("maven.modrinth:AdditionalEntityAttributes:${project.aea_version}"))

    // Misc Required
    modApi("com.github.Virtuoel:Pehkui:${pehkui_version}", {exclude group: "net.fabricmc.fabric-api"})

    // Icarus + Deps
    modImplementation ("dev.emi:trinkets:${project.trinkets_version}")
    modImplementation("maven.modrinth:icarus:${project.icarus_version}+Fabric")
    modLocalRuntime("com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.20.1:${project.resourceful_version}")
    modLocalRuntime ("mysticdrew:common-networking-fabric:${project.cmnw_version}")

    // RPG Series
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-fabric")
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-fabric")
    modLocalRuntime("maven.modrinth:runes:${project.runes_version}-fabric")
    modImplementation("maven.modrinth:better-combat:${project.bettercombat_version}-fabric")
    modLocalRuntime("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-fabric")
    modImplementation "curse.maven:rpgmana-1021902:5447010"

    modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}")
    implementation("com.github.ZsoltMolnarrr:TinyConfig:${project.tiny_config_version}")
    modLocalRuntime("mod.azure.azurelibarmor:azurelibarmor-fabric-${project.minecraft_version}:${project.azure_lib_version}")

    modImplementation("dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}")

    //runtimeOnly "curse.maven:architectury-api-419699:5137936"
}


publishMods {
    file = remapJar.archiveFile
    modLoaders.add("fabric")
    changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
    version = "Fabric-${project.version}+${minecraft_version}"
    type = STABLE
    displayName = "Fabric-${project.version}+${minecraft_version}"

    curseforge {
        projectId = "${curseforge_project}"
        accessToken = System.getenv("CF_TOKEN")

        minecraftVersions.add(minecraft_version)

        clientRequired = true
        serverRequired = true

        // Dependencies
        requires "origins"
        requires "icarus"
        requires "pehkui"
        requires "spell-power"
    }
    modrinth {
        projectId = "3FJ8AhW0"
        accessToken = System.getenv("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires "origins"
        requires "icarus"
        requires "pehkui"
        requires "spell-power"
    }
}
