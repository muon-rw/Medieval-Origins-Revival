modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
issueTrackerURL="https://github.com/${sources}/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}+${minecraft_version}"
displayName="${mod_name}"
displayURL="${curseforge_page}"
logoFile="assets/${mod_id}/icon.png"
logoBlur=false
authors="${mod_author}"
credits="${neoforge_mod_contributors}"
description='''
${mod_description}
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${neoforge_minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="apoli"
type="required"
versionRange="[${apoli_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="origins"
type="required"
versionRange="[${origins_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="spell_engine"
type="required"
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="icarus"
type="optional"
versionRange="[4.8.1,)"
ordering="NONE"
side="BOTH"
